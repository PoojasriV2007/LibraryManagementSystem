# Netlify: deploys the React frontend from the frontend/ folder.
# Set VITE_API_URL in Netlify → Site settings → Environment variables to your Render API URL.
[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
